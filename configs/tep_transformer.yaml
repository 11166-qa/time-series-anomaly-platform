dataset:
  name: TEP
  data_dir: data/processed/TEP


model:
  name: Transformer

  lookback: 48
  pred_len: 6

  d_model: 64
  nhead: 4
  num_layers: 2
  dim_feedforward: 128

  dropout: 0.1


training:

  batch_size: 128

  learning_rate: 0.001

  weight_decay: 0.0001

  max_epochs: 30

  early_stopping_patience: 8

  grad_clip: 1.0

  seed: 42


output:

  result_dir: results/TEP/Transformer/case_study